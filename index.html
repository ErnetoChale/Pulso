/* VOICE: guardia nocturna: directo, legible a las 4 a. m., con la seriedad de un expediente.

   COLOUR and TYPE: papel rosa de ECG, tinta casi negra, rojo de alarma; de noche, verde de monitor. Fraunces en títulos, Arial en texto y etiquetas.

:root{color-scheme:light dark;

--red:light-dark(#c8102e,#ff5a6a);--ok:light-dark(#0f7a43,#3ef07a);

*{box-sizing:border-box;min-width:0}

button{cursor:pointer;min-height:44px;border-radius:999px;border:1px solid var(--ink);background:var(--panel);padding:8px 18px;transition:transform .2s,background-color .2s,color .2s}

.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}

.logo{display:block;width:40px;height:40px;line-height:0}

.lede{max-width:62ch;margin:0;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:18px;margin-top:24px}
.card{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:18px 18px 18px 30px;display:flex;flex-direction:column;gap:8px;animation:rise .55s both;animation-delay:calc(var(--i,0)*80ms + .3s);box-shadow:0 1px 0 var(--line)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:12px;border-radius:5px 0 0 5px;background:var(--tri,#999);background-image:repeating-linear-gradient(180deg,transparent 0 10px,#0002 10px 12px)}
.card h3{margin:0;font:800 24px/1.12 var(--disp);letter-spacing:-.01em}
.tag{display:inline-block;font:700 13px/1.4 var(--mono);padding:3px 9px;border-radius:3px;background:var(--acc2);color:var(--ink);text-transform:uppercase;letter-spacing:.02em}
.tri{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--mono);text-transform:uppercase}.tri i{width:12px;height:12px;border-radius:50%;background:var(--tri)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sim{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}

.pt{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}

.mon .scr{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px}
@media(max-width:520px){.mon .scr{grid-template-columns:minmax(0,1fr)}}
.wave{position:relative;height:210px;background-image:linear-gradient(#0f2a20 1px,transparent 1px),linear-gradient(90deg,#0f2a20 1px,transparent 1px);background-size:30px 30px}
.wave canvas{position:absolute;inset:0;width:100%;height:100%}
.vit{display:grid;gap:6px;grid-template-columns:1fr}
@media(max-width:520px){.vit{grid-template-columns:repeat(3,minmax(0,1fr))}}
.v{border-left:3px solid currentColor;padding:2px 0 2px 10px}
.v small{display:block;font:500 12px var(--mono);opacity:.8;text-transform:uppercase}
.v span{font:700 clamp(24px,3vw,32px)/1.05 var(--mono);white-space:nowrap;text-shadow:0 0 12px currentColor}
.v.alarm{animation:blink 1s steps(2) infinite}
.hr{color:#3ef07a}.bp{color:#ff6b6e}.sp{color:#38d6f5}.rr{color:#ffd23f}.tp{color:#e8f0ee}
.monbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 13px var(--mono);color:#9fb3ae;margin-bottom:6px;text-transform:uppercase}
.state{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:0;padding:16px}
.state b{font-family:var(--mono);font-size:13px;text-transform:uppercase;color:var(--mute)}
.banner{margin-top:12px;border-radius:4px;padding:12px 14px;font-weight:700}
.banner.bad{background:var(--red);color:#fff}.banner.good{background:light-dark(#d6f1e0,#0f2a1e);color:var(--ok);border:1.5px solid var(--ok)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1.5px solid var(--line)}
.tabs button{flex:none;border:0;border-bottom:4px solid transparent;border-radius:0;background:none;white-space:nowrap;color:var(--mute);font:800 18px var(--disp);text-transform:uppercase;letter-spacing:.03em}
.tabs button:hover{box-shadow:none;transform:none;color:var(--ink)}
.tabs button{font:500 12px Arial,sans-serif;letter-spacing:.14em}.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--red)}
.acts{display:grid;gap:6px;padding:12px 0;max-height:380px;overflow:auto}
.acts button{border-radius:4px;border-color:var(--line);text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.acts button .m{font:500 13px var(--mono);color:var(--mute);white-space:nowrap}
.acts button.done{border-color:var(--ink);background:var(--acc2)}
.acts button.done span:first-child::before{content:"✓ ";color:var(--ok);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:6px 16px 16px}
.feed{display:grid;gap:8px;max-height:420px;overflow:auto;margin-top:6px}
.ent{border-left:3px solid var(--line);padding:4px 0 4px 12px;animation:rise .35s both}
.ent .t{font:500 12px var(--mono);color:var(--mute);text-transform:uppercase}
.ent.k-t{border-color:#2b8fd6}.ent.k-r{border-color:var(--ink)}.ent.k-s{border-color:var(--red)}.ent.k-h,.ent.k-e{border-color:var(--mute)}
.ent .harm{color:var(--red);font-weight:700}
.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:10;animation:fade .2s both}
.modal{background:var(--panel);border-radius:6px;border-top:6px solid var(--red);padding:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;animation:rise .3s both}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:4px;margin:6px 0;cursor:pointer;min-height:44px}

.opt input{margin-top:5px;width:18px;height:18px;accent-color:var(--red)}
.score{font:800 clamp(88px,13vw,160px)/.85 var(--disp);color:var(--red)}
.chk{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.chk li{display:flex;gap:10px;padding:8px 12px;border-radius:0;background:var(--panel);border:1px solid var(--line);animation:rise .4s both}
.chk li:nth-child(n){animation-delay:calc(var(--i,0)*50ms)}
.chk .y{color:var(--ok);font-weight:700}.chk .n{color:var(--red);font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media(max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
textarea{width:100%;min-height:200px;border:1.5px solid var(--line);border-radius:4px;padding:12px;background:var(--panel);font:14px/1.45 var(--mono)}
input[type=password],#gho,#ghr,#ghb{font-family:var(--mono)}
pre{overflow-x:auto;background:var(--panel);border:1.5px solid var(--line);border-radius:4px;padding:12px;font:13px/1.45 var(--mono);max-height:340px}
details summary{font:500 12px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.msg{min-height:22px;font-weight:700}
.fld{display:grid;gap:4px;margin:10px 0;font-weight:700}
.fld input{min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg);font-size:16px;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:14px 16px;animation:rise .45s both}
.stat span{display:block;font:800 clamp(38px,5vw,56px)/1 var(--disp);color:var(--red)}.stat small{font-size:14px;color:var(--mute)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1.5px solid var(--line);border-radius:6px}

.mycases{display:grid;gap:10px}.mycases .card{animation:none}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 10px;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}}
.eyebrow{display:flex;align-items:center;gap:12px;font:500 12px/1 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:0 0 22px}
.eyebrow::before{content:"";width:44px;height:1px;background:currentColor}
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:0;align-items:center;padding:clamp(56px,9vw,128px) 0 clamp(40px,6vw,88px) max(6vw,16px);max-width:1440px;margin:0 auto;overflow:visible}

.hero-vis{position:relative;align-self:stretch;display:flex;align-items:center;min-height:360px}

.mini svg{width:100%;height:150px;display:block}

.mini .vrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px 20px 0 0}

.divider{display:block;width:100%;height:70px;margin-top:-1px}
.divider path{fill:var(--panel)}
.libsec{background:var(--panel);padding:clamp(24px,4vw,56px) max(4vw,16px) clamp(80px,10vw,140px) max(10vw,16px)}
.libhead{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:24px;align-items:end;max-width:1240px}
.libhead .legend{justify-content:flex-end;margin:0}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;margin-top:34px;max-width:1240px}
.bento .card{grid-column:span 5;border-radius:0;border:1px solid var(--line);border-top:4px solid var(--tri);padding:24px;background:var(--bg);transition:transform .2s,border-color .2s}
.bento .card::before{display:none}
.bento .card:hover{transform:translateY(-4px);border-color:var(--ink);border-top-color:var(--tri)}
.bento .card.big{grid-column:span 7;grid-row:span 2;padding:32px}
.bento .card.big h3{font-size:clamp(30px,3.4vw,44px)}
.bento .card.wide{grid-column:span 7}
.num{font:600 italic 44px/1 var(--disp);color:var(--red)}
.card .meta{font:500 11px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.card .intro{font-size:17px;border-left:1px solid var(--line);padding-left:14px;margin:6px 0}
.card .row button{font-size:15px}
@media(max-width:860px){.hero{grid-template-columns:minmax(0,1fr);padding-right:0}.hero h1{margin-right:0}.hero-vis{min-height:0;margin-top:40px}.bignum{left:auto;right:6%;top:auto;bottom:-58px;font-size:110px;z-index:2}.bignum-l{display:none}
.libhead{grid-template-columns:minmax(0,1fr)}.libhead .legend{justify-content:flex-start}.bento .card,.bento .card.big,.bento .card.wide{grid-column:1/-1;grid-row:auto}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}

@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.strip path{stroke-dashoffset:0}}
</style>

<script>
{
const KEY='guardia.cases.v1',PK='pulso.profiles.v1',AK='pulso.active.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BUILTIN=JSON.parse($('#builtin').textContent);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
/* Perfiles locales: viven en este navegador. El PIN se guarda como hash, pero cualquiera con acceso al dispositivo puede leer los datos. */
let profiles=ls.get(PK,[]),active=ls.get(AK,null),repo=[],shared=[];
const me=()=>profiles.find(p=>p.id===active)||null;
let mine=me()?me().cases:[];
const saveAll=()=>ls.set(PK,profiles);
const saveMine=()=>{const p=me();if(p){p.cases=mine;saveAll()}};
const legacy=ls.get(KEY,[]);
const othersPublic=()=>profiles.filter(p=>p.id!==active).flatMap(p=>(p.cases||[]).filter(c=>c._pub));
const all=()=>{const out=[],ids=new Set();for(const c of [...BUILTIN,...repo,...mine,...othersPublic(),...shared])if(!ids.has(c.id)){ids.add(c.id);out.push(c)}return out};
const clean=c=>{const o={...c};if(c._by)o.author=c._by;for(const k of Object.keys(o))if(k.startsWith('_'))delete o[k];return o};
async function hashPin(salt,pin){const s=salt+':'+pin;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let x=5381;for(const ch of s)x=((x<<5)+x+ch.charCodeAt(0))|0;return 'f'+(x>>>0).toString(16)}}
function login(p){active=p.id;ls.set(AK,active);mine=p.cases=p.cases||[];
  if(legacy.length&&!p.cases.length){p.cases=mine=legacy.map(c=>({...c,_owner:p.id,_by:p.name,_pub:false}));ls.set(KEY,[]);legacy.length=0}saveAll();nav()}
function logout(){active=null;ls.set(AK,null);mine=[];nav()}
function nav(){const b=$('#nav-me');if(b)b.textContent=me()?me().name:'Entrar'}
/* Enlaces para compartir un caso: el JSON va comprimido en el hash de la URL */
const toB64u=u8=>btoa(String.fromCharCode(...u8)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const fromB64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function pack(c){const t=new TextEncoder().encode(JSON.stringify(clean(c)));try{const st=new Blob([t]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+toB64u(new Uint8Array(await new Response(st).arrayBuffer()))}catch(e){let s='';for(let i=0;i<t.length;i+=8000)s+=String.fromCharCode(...t.subarray(i,i+8000));return 'j'+toB64u(Uint8Array.from(s,ch=>ch.charCodeAt(0)))}}
async function unpack(s){const u=fromB64u(s.slice(1));if(s[0]==='z'){const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(st).text())}return JSON.parse(new TextDecoder().decode(u))}

/* Guardar en GitHub con la API de contenidos y un token personal guardado solo en este navegador */
const GHK='guardia.gh.v1';let gh={};try{gh=JSON.parse(localStorage.getItem(GHK)||'{}')}catch(e){}
const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
async function ghPut(path,text,msg){
  const base=`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${path}`,h={Authorization:'Bearer '+gh.token,Accept:'application/vnd.github+json'};
  let sha;const g=await fetch(base+'?ref='+encodeURIComponent(gh.branch||'main'),{headers:h});if(g.ok)sha=(await g.json()).sha;
  const p=await fetch(base,{method:'PUT',headers:h,body:JSON.stringify({message:msg,content:b64(text),branch:gh.branch||'main',sha})});
  if(!p.ok)throw new Error('GitHub respondió '+p.status+(p.status===401?' (token inválido)':p.status===404?' (repo o permisos)':''));
}
async function ghSave(cases){
  if(!gh.owner||!gh.repo||!gh.token)throw new Error('Configura usuario, repositorio y token primero.');
  const h={Authorization:'Bearer '+gh.token,Accept:'application/vnd.github+json'};
  let idx=[];const r=await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/cases/index.json?ref=${encodeURIComponent(gh.branch||'main')}`,{headers:h});
  if(r.ok){try{idx=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob((await r.json()).content.replace(/\n/g,'')),c=>c.charCodeAt(0))))}catch(e){idx=[]}}
  for(const c of cases){const f=c.id.replace(/[^a-z0-9_-]/gi,'-')+'.json';await ghPut('cases/'+f,JSON.stringify(clean(c),null,2)+'\n','Agrega caso: '+c.title);if(!idx.includes(f))idx.push(f)}
  await ghPut('cases/index.json',JSON.stringify(idx,null,2)+'\n','Actualiza índice de casos');
}

function normalize(c){
  if(!c||typeof c!=='object')throw new Error('No es un objeto JSON.');
  for(const k of['id','title','start','states'])if(!c[k])throw new Error('Falta el campo "'+k+'".');
  if(!c.states[c.start])throw new Error('El estado inicial "'+c.start+'" no existe en "states".');
  for(const k of['history','exam','tests','treatments'])c[k]=Array.isArray(c[k])?c[k]:[];
  c.patient=c.patient||{};c.scoring=c.scoring||{};c.scoring.critical=c.scoring.critical||[];c.scoring.avoid=c.scoring.avoid||[];
  c.debrief=c.debrief||{};c.diagnosis=c.diagnosis||{options:[],correct:0};
  for(const [id,s] of Object.entries(c.states)){s.v=s.v||{};if(s.worse&&!c.states[s.worse.to])throw new Error('El estado "'+id+'" empeora hacia "'+s.worse.to+'", que no existe.')}
  return c;
}

/* ---------- Simulación ---------- */
function play(id){
  const c=all().find(x=>x.id===id);if(!c)return lib();
  app.dataset.view='sim';S={c,st:c.start,t:0,tin:0,done:[],log:[],visited:new Set([c.start]),harms:[],tab:'h',over:null,dx:null};
  addLog('s',`${c.setting||''}. ${c.intro||''}`,'Llegada');
  renderSim();startMon();
}
const cur=()=>S.c.states[S.st];
function addLog(k,txt,title,harm){S.log.unshift({k,t:S.t,txt,title,harm})}
function setState(id,auto){
  S.st=id;S.tin=0;S.visited.add(id);const s=cur();
  addLog('s',s.d||'',(auto?'Evolución: ':'Respuesta: ')+(s.label||id));
  if(s.end){S.over=s.end}
}
function advance(m){
  while(m>0&&!S.over){const s=cur();
    if(s.worse&&S.tin+m>=s.worse.after){const step=Math.max(0,s.worse.after-S.tin);S.t+=step;m-=step;setState(s.worse.to,true)}
    else{S.t+=m;S.tin+=m;m=0}}
}
function resolve(r){if(r&&typeof r==='object')return r[S.st]??r['*']??'';return r??''}
function act(kind,it){
  if(S.over)return;
  const min=it.min??(kind==='h'?2:kind==='e'?3:5);
  if(it.needs&&!it.needs.every(n=>S.done.some(d=>d.id===n))){addLog('r','Necesitas antes: '+it.needs.map(n=>name(n)).join(', ')+'.',name(it.id));return renderSim()}
  advance(min);if(S.over)return renderSim();
  S.done.push({id:it.id,t:S.t});
  if(kind==='h')addLog('h',it.a,it.q);
  else if(kind==='e')addLog('e',it.f,it.n);
  else if(kind==='t')addLog('t',resolve(it.r),it.n);
  else{
    let harm='';
    if(it.harm&&(!it.harm.when||it.harm.when.includes(S.st))){harm=it.harm.msg;S.harms.push({t:S.t,n:it.n,msg:harm})}
    addLog('r',it.note||'Indicado.',it.n,harm);
    if(it.delay)S.tin=Math.max(0,S.tin-it.delay);
    if(it.goto&&(!it.when||it.when.includes(S.st))&&it.goto!==S.st)setState(it.goto,false);
  }
  renderSim();
}
function name(id){const c=S.c;const x=[...c.history.map(h=>({id:h.id,n:h.q})),...c.exam,...c.tests,...c.treatments].find(a=>a.id===id);return x?x.n:id}
const hhmm=m=>`T+${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

  $('#fin').onclick=()=>S.over?debrief():finishModal();

/* ---------- Monitor ---------- */
let jit={hr:0,sp:0},lastJ=0,cvs=null,ctx=null,x=0,tt=0,lastTs=0,prevY=[null,null];
function vitals(){
  const v=cur().v,el=$('#vit');if(!el)return;
  const hr=v.hr?v.hr+jit.hr:0,sp=v.spo2?Math.min(100,v.spo2+jit.sp):0;
  const cell=(cls,lab,val,alarm)=>`<div class="v ${cls}${alarm?' alarm':''}"><small>${lab}</small><span>${val}</span></div>`;
  el.innerHTML=cell('hr','FC lpm',hr||'---',hr<50||hr>130)+cell('bp','PA mmHg',v.sbp?`${v.sbp}/${v.dbp}`:'---',v.sbp<90)+cell('sp','SpO₂ %',sp||'---',sp<90)+cell('rr','FR rpm',v.rr||'---',v.rr<8||v.rr>28)+cell('tp','Temp °C',(v.t??'').toString());
}
function bindCanvas(){cvs=$('#cv');if(!cvs)return;ctx=cvs.getContext('2d');const r=cvs.getBoundingClientRect(),d=devicePixelRatio||1;cvs.width=r.width*d;cvs.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);x=0;prevY=[null,null];ctx.fillStyle='#05080a';ctx.fillRect(0,0,r.width,r.height)}
const g=(p,m,w)=>Math.exp(-((p-m)**2)/(2*w*w));
function ecg(time){
  const s=cur(),rh=s.rhythm||'sinus',hr=s.v.hr||0;
  if(rh==='fv')return 0.45*Math.sin(time*31)+0.3*Math.sin(time*19+1.3)+0.2*Math.sin(time*47);
  if(rh==='asistolia'||!hr)return 0.02*Math.sin(time*7);
  const per=60/hr,beat=Math.floor(time/per),ph=(time%per)/per;
  if(rh==='ectopia'&&beat%4===3)return 1.1*g(ph,.3,.035)-0.6*g(ph,.4,.05)-0.25*g(ph,.6,.06);
  const st=rh==='st'?0.28*(ph>.33&&ph<.47?1:g(ph,.47,.035)):0;
  return 0.12*g(ph,.15,.025)-0.12*g(ph,.27,.008)+g(ph,.3,.011)-0.28*g(ph,.325,.01)+st+(rh==='st'?0.42:0.3)*g(ph,.47,.04);
}
function pleth(time){const s=cur(),hr=s.v.hr||0;if(!hr||!s.v.spo2)return 0;const ph=((time-0.18)%(60/hr))/(60/hr);return g(ph,.35,.09)+0.35*g(ph,.62,.07)}
function frame(ts){
  raf=requestAnimationFrame(frame);if(!ctx||!cvs.isConnected)return;
  const dt=Math.min(.05,(ts-(lastTs||ts))/1000);lastTs=ts;
  if(ts-lastJ>2000){lastJ=ts;jit={hr:Math.round(Math.random()*2-1),sp:Math.round(Math.random()*1-0.5)};vitals()}
  const W=cvs.clientWidth,H=cvs.clientHeight,sp=110;let n=Math.max(1,Math.round(dt*sp));
  for(let i=0;i<n;i++){tt+=1/sp;x+=1;if(x>W){x=0;prevY=[null,null]}
    ctx.fillStyle='#05080a';ctx.fillRect(x,0,12,H);
    const y1=H*.36-ecg(tt)*H*.26,y2=H*.9-pleth(tt)*H*.2;
    [[y1,'#3ef07a',0],[y2,'#38d6f5',1]].forEach(([y,c,k])=>{ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-1,prevY[k]??y);ctx.lineTo(x,y);ctx.stroke();prevY[k]=y});}
}
function staticDraw(){if(!ctx)return;const W=cvs.clientWidth,H=cvs.clientHeight;ctx.fillStyle='#05080a';ctx.fillRect(0,0,W,H);[[t=>H*.36-ecg(t)*H*.26,'#3ef07a'],[t=>H*.9-pleth(t)*H*.2,'#38d6f5']].forEach(([f,c])=>{ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<W;i++){const y=f(i/110);i?ctx.lineTo(i,y):ctx.moveTo(i,y)}ctx.stroke()})}
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
function startMon(){stopMon();if(reduce.matches){staticDraw();raf=-1}else raf=requestAnimationFrame(frame)}
function stopMon(){if(raf>0)cancelAnimationFrame(raf);raf=0}
const ro=new ResizeObserver(()=>{if(S&&$('#cv')){bindCanvas();if(reduce.matches)staticDraw()}});ro.observe(document.body);

/* ---------- Cierre y retroalimentación ---------- */
function finishModal(){
  const o=S.c.diagnosis.options||[];
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">¿Cuál es tu diagnóstico?</h2>
  ${o.map((t,i)=>`<label class="opt"><input type="radio" name="dx" value="${i}"><span>${esc(t)}</span></label>`).join('')||'<p class="mute">Este caso no tiene opciones de diagnóstico.</p>'}
  <div class="row" style="margin-top:14px"><button class="ghost" id="mc">Seguir con el caso</button><span style="flex:1"></span><button class="pri" id="mo">Cerrar caso</button></div></div>`;
  document.body.append(ov);
  ov.querySelector('#mc').onclick=()=>ov.remove();
  ov.querySelector('#mo').onclick=()=>{const r=ov.querySelector('input[name=dx]:checked');S.dx=r?+r.value:null;ov.remove();S.over=S.over||'fin';debrief()};
}
function debrief(){
  stopMon();app.dataset.view='deb';
  const c=S.c,when=id=>S.done.find(d=>d.id===id);
  const items=c.scoring.critical.map(k=>{
    const hit=(k.a||[]).map(when).filter(Boolean).sort((a,b)=>a.t-b.t)[0];
    let ok=!!hit,why='';
    if(ok&&k.by!=null&&hit.t>k.by){ok=false;why=`lo hiciste a los ${hit.t} min`}
    if(ok&&k.before){const b=when(k.before);if(b&&b.t<hit.t){ok=false;why='lo hiciste después de «'+name(k.before)+'»'}}
    if(!hit&&k.before&&!when(k.before)&&k.a.some(a=>a.startsWith('h'))){}
    return{label:k.label,ok,why:why||(hit?`a los ${hit.t} min`:'no se hizo'),w:k.w||1}});
  const avoid=c.scoring.avoid.map(a=>({label:a.label,ok:!S.visited.has(a.state),why:S.visited.has(a.state)?'ocurrió':'',w:a.w||1}));
  const list=[...items,...avoid],tot=list.reduce((a,b)=>a+b.w,0)||1,got=list.filter(i=>i.ok).reduce((a,b)=>a+b.w,0);
  const dxOk=S.dx!=null&&S.dx===c.diagnosis.correct;
  let score=Math.round(100*got/tot)-10*S.harms.length-(S.over==='muerte'?30:0)+(c.diagnosis.options?.length?(dxOk?0:-10):0);
  score=Math.max(0,Math.min(100,score));
  const goal=[...S.visited].some(id=>c.states[id].goal);
  let saved='';if(!S.saved&&me()){const p=me();p.history=p.history||[];p.history.unshift({caseId:c.id,title:c.title,score,date:new Date().toISOString(),dx:S.dx==null?null:dxOk,harms:S.harms.length,death:S.over==='muerte',min:S.t});saveAll();S.saved=true}
  saved=me()?'<p class="small mute">Guardado en tu historial.</p>':'<p class="small"><button id="savecta">Crea una cuenta para guardar tus puntajes</button></p>';
  const li=i=>`<li><span class="${i.ok?'y':'n'}">${i.ok?'✓':'✗'}</span><span>${esc(i.label)} <span class="mute small">${esc(i.why)}</span></span></li>`;
  app.innerHTML=`<section class="band">
  <div class="two"><div>
    <span class="tag">${esc(c.specialty||'')}</span>
    <h1 style="margin-top:10px">${esc(c.title)}</h1>
    <div class="row" style="align-items:flex-end;gap:18px"><div class="score">${score}</div><div class="mute" style="padding-bottom:10px">de 100 · ${S.t} min simulados<br>${S.over==='muerte'?'El paciente falleció':goal?'Alcanzaste el objetivo terapéutico':'No se alcanzó el objetivo terapéutico'}</div></div>
    <p><b>Tu diagnóstico:</b> ${S.dx!=null?esc(c.diagnosis.options[S.dx]):'sin respuesta'} ${S.dx!=null?(dxOk?'<span class="y" style="color:var(--ok)">✓ correcto</span>':'<span style="color:var(--red)">✗</span>'):''}<br>
    <b>Diagnóstico del caso:</b> ${esc(c.diagnosis.options?.[c.diagnosis.correct]||'')}</p>
    <p>${esc(c.debrief.summary||'')}</p>
    <div class="row"><button class="pri" id="again">Repetir caso</button><button id="back">Biblioteca</button></div>${saved}
  </div><div>
    <h2>Acciones críticas</h2><ul class="chk">${list.map(li).join('')}</ul>
    ${S.harms.length?`<h2 style="margin-top:20px">Errores con riesgo (−10 c/u)</h2><ul class="chk">${S.harms.map(h=>`<li><span class="n">⚠</span><span><b>${esc(h.n)}</b> <span class="mute small">${hhmm(h.t)}</span><br>${esc(h.msg)}</span></li>`).join('')}</ul>`:''}
  </div></div>
  <div class="two" style="margin-top:28px"><div><h2>Puntos clave</h2><ul>${(c.debrief.points||[]).map(p=>`<li style="margin-bottom:6px">${esc(p)}</li>`).join('')}</ul>
  <h2 style="font-size:17px">Referencias</h2><ul class="small mute">${(c.debrief.refs||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul><p class="small mute">${esc(c.source||'')}</p></div>
  <div><h2>Tu línea de tiempo</h2><div class="feed" style="max-height:520px">${[...S.log].reverse().map(e=>`<div class="ent k-${e.k}"><div class="t">${hhmm(e.t)} · ${esc(e.title||'')}</div><div>${esc(e.txt)}</div>${e.harm?`<div class="harm">⚠ ${esc(e.harm)}</div>`:''}</div>`).join('')}</div></div></div>
  </section>`;
  $('#again').onclick=()=>play(c.id);$('#back').onclick=lib;$('#savecta')&&($('#savecta').onclick=()=>auth('new',()=>{const p=me();p.history=p.history||[];p.history.unshift({caseId:c.id,title:c.title,score,date:new Date().toISOString(),dx:S.dx==null?null:dxOk,harms:S.harms.length,death:S.over==='muerte',min:S.t});saveAll();S.saved=true;debrief()}));scrollTo(0,0);
}

/* ---------- Cuentas ---------- */
function auth(mode,then){
  const ov=document.createElement('div');ov.className='overlay';
  const draw=()=>{ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="at">
    <div class="tabs" role="tablist"><button role="tab" aria-selected="${mode==='in'}" data-m="in">Entrar</button><button role="tab" aria-selected="${mode==='new'}" data-m="new">Crear cuenta</button></div>
    <h2 id="at" style="margin-top:16px">${mode==='in'?'Entrar a Pulso':'Crear cuenta'}</h2>
    ${mode==='in'?(profiles.length?`<div class="row" id="plist">${profiles.map(p=>`<button data-p="${esc(p.id)}">${esc(p.name)}</button>`).join('')}</div>
      <label class="fld">PIN<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6"></label>`:'<p class="mute">Todavía no hay cuentas en este dispositivo.</p>')
    :`<label class="fld">Nombre<input id="nm" autocomplete="nickname" maxlength="40"></label>
      <label class="fld">PIN de 4 a 6 números<input id="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6"></label>
      <label class="fld">Repite el PIN<input id="pin2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6"></label>`}
    <p class="msg" id="am" role="status" style="color:var(--red)"></p>
    <p class="small mute">Tu cuenta y tus datos se guardan solo en este navegador y dispositivo. Para pasarlos a otro, usa «Respaldar» en tu perfil.</p>
    <div class="row"><button class="ghost" id="ax">Cancelar</button><span style="flex:1"></span><button class="pri" id="ao">${mode==='in'?'Entrar':'Crear cuenta'}</button></div></div>`;
    let pick=profiles.length===1?profiles[0].id:null;
    const mark=()=>ov.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('pri',b.dataset.p===pick));mark();
    ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pick=b.dataset.p;mark();ov.querySelector('#pin').focus()});
    ov.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
    ov.querySelector('#ax').onclick=()=>ov.remove();
    const am=ov.querySelector('#am');
    ov.querySelector('#ao').onclick=async()=>{
      const pin=(ov.querySelector('#pin')?.value||'').trim();
      if(mode==='new'){const nm=ov.querySelector('#nm').value.trim();
        if(!nm)return am.textContent='Escribe tu nombre.';
        if(profiles.some(p=>p.name.toLowerCase()===nm.toLowerCase()))return am.textContent='Ya existe una cuenta con ese nombre en este dispositivo.';
        if(!/^\d{4,6}$/.test(pin))return am.textContent='El PIN debe tener de 4 a 6 números.';
        if(pin!==ov.querySelector('#pin2').value.trim())return am.textContent='Los PIN no coinciden.';
        const id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        const p={id,name:nm,pin:await hashPin(id,pin),created:new Date().toISOString(),history:[],cases:[]};
        profiles.push(p);if(!saveAll()){profiles.pop();return am.textContent='Este navegador no permite guardar datos (modo privado o almacenamiento bloqueado).'}
        login(p)}
      else{const p=profiles.find(x=>x.id===pick);if(!p)return am.textContent='Elige tu cuenta.';
        if(await hashPin(p.id,pin)!==p.pin)return am.textContent='PIN incorrecto.';login(p)}
      ov.remove();then?then():profile()};
    ov.querySelector('input')?.focus()};
  document.body.append(ov);draw();
}
const fmtD=s=>{try{return new Date(s).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}catch(e){return s}};
function profile(){
  stopMon();S=null;app.dataset.view='me';const p=me();if(!p)return auth('in');
  const hs=p.history||[],avg=hs.length?Math.round(hs.reduce((a,b)=>a+b.score,0)/hs.length):null,bestS=hs.length?Math.max(...hs.map(x=>x.score)):null;
  const ok=hs.filter(x=>x.dx===true).length;
  app.innerHTML=`<section class="band"><h1>${esc(p.name)}</h1><p class="mute" style="margin-top:-6px">Cuenta creada el ${fmtD(p.created)}</p>
  <div class="stats">${[['Casos resueltos',hs.length],['Promedio',avg??'—'],['Mejor puntaje',bestS??'—'],['Diagnósticos correctos',hs.length?ok+'/'+hs.length:'—']].map(([k,v])=>`<div class="stat"><span>${v}</span><small>${k}</small></div>`).join('')}</div>
  <div class="two" style="margin-top:28px"><div>
    <h2>Historial</h2>
    ${hs.length?`<table class="stack hist"><thead><tr><th>Fecha</th><th>Caso</th><th>Puntaje</th><th>Dx</th><th>Errores</th></tr></thead><tbody>${hs.map(x=>`<tr><td>${fmtD(x.date)}</td><td>${esc(x.title)}${x.death?' <span style="color:var(--red)">(falleció)</span>':''}</td><td class="num"><b>${x.score}</b></td><td>${x.dx===true?'✓':x.dx===false?'✗':'—'}</td><td class="num">${x.harms}</td></tr>`).join('')}</tbody></table>`:'<p class="mute">Aún no resuelves ningún caso. Tus puntajes aparecerán aquí.</p>'}
  </div><div>
    <h2>Mis casos</h2>
    ${mine.length?`<div class="mycases">${mine.map(c=>`<div class="card" style="--tri:${TRI[c.level]||'#8a8a8a'}"><h3>${esc(c.title)}</h3>
      <label class="row small" style="min-height:44px"><input type="checkbox" data-pub="${esc(c.id)}" ${c._pub?'checked':''} style="width:20px;height:20px"> Público</label>
      <div class="row"><button class="pri" data-play="${esc(c.id)}">Jugar</button>${c._pub?`<button data-share="${esc(c.id)}">Enlace para compartir</button>`:''}${c._pub&&gh.token?`<button data-gh="${esc(c.id)}">Publicar en GitHub</button>`:''}<button class="ghost" data-del="${esc(c.id)}">Eliminar</button></div></div>`).join('')}</div>`:'<p class="mute">No has agregado casos.</p>'}
    <button style="margin-top:10px" id="pnew">Agregar un caso</button>
    <div id="shbox" hidden style="margin-top:14px"><p class="small"><b>Enlace del caso.</b> Quien lo abra puede jugarlo sin cuenta. Funciona con la app publicada en GitHub Pages.</p><textarea id="shl" readonly style="min-height:90px"></textarea><button id="shc">Copiar enlace</button></div>
    <p class="msg" id="pm" role="status"></p>
    <h2 style="margin-top:26px">Cuenta</h2>
    <div class="row"><button id="bk">Respaldar mi cuenta</button><button id="rs">Restaurar respaldo</button><button class="ghost" id="lo">Cerrar sesión</button><button class="ghost" id="dl" style="color:var(--red)">Eliminar cuenta</button></div>
    <div id="bkbox" hidden style="margin-top:12px"><textarea id="bkt" placeholder="Pega aquí un respaldo para restaurarlo"></textarea><div class="row" style="margin-top:8px"><button id="bkc">Copiar</button><button class="pri" id="bki" hidden>Restaurar</button></div></div>
  </div></div></section>`;
  const pm=$('#pm'),say=(t,c)=>{pm.style.color=c||'var(--ok)';pm.textContent=t};
  app.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));
  app.querySelectorAll('[data-pub]').forEach(b=>b.onchange=()=>{const c=mine.find(x=>x.id===b.dataset.pub);c._pub=b.checked;saveMine();profile()});
  app.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{const c=mine.find(x=>x.id===b.dataset.share);const l=await shareLink(c);$('#shbox').hidden=false;$('#shl').value=l;try{await navigator.clipboard.writeText(l);say('Enlace copiado.')}catch(e){say('Copia el enlace del recuadro.')}});
  $('#shc').onclick=async()=>{try{await navigator.clipboard.writeText($('#shl').value);say('Enlace copiado.')}catch(e){$('#shl').select()}};
  app.querySelectorAll('[data-gh]').forEach(b=>b.onclick=()=>{const c=mine.find(x=>x.id===b.dataset.gh);say('Subiendo…','var(--ink)');ghSave([c]).then(()=>say('Publicado en GitHub. Aparece para todos en 1–2 min.')).catch(e=>say(e.message,'var(--red)'))});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(b.dataset.armed){mine=mine.filter(m=>m.id!==b.dataset.del);saveMine();profile()}else{b.dataset.armed=1;b.textContent='¿Seguro?'}});
  $('#pnew').onclick=add;$('#lo').onclick=()=>{logout();lib()};
  $('#dl').onclick=e=>{if(e.target.dataset.armed){profiles=profiles.filter(x=>x.id!==p.id);saveAll();logout();lib()}else{e.target.dataset.armed=1;e.target.textContent='Se borran historial y casos. Toca otra vez'}};
  $('#bk').onclick=()=>{$('#bkbox').hidden=false;$('#bki').hidden=true;$('#bkc').hidden=false;$('#bkt').value=JSON.stringify({pulso:1,profile:p},null,1)};
  $('#bkc').onclick=async()=>{try{await navigator.clipboard.writeText($('#bkt').value);say('Respaldo copiado. Guárdalo en un lugar seguro.')}catch(e){$('#bkt').select();say('Selecciona el texto y cópialo.')}};
  $('#rs').onclick=()=>{$('#bkbox').hidden=false;$('#bki').hidden=false;$('#bkc').hidden=true;$('#bkt').value='';$('#bkt').focus()};
  $('#bki').onclick=()=>{try{const d=JSON.parse($('#bkt').value);if(!d.pulso||!d.profile?.id||!d.profile?.pin)throw 0;const q=d.profile;q.cases=(q.cases||[]).filter(c=>{try{normalize(c);return true}catch(e){return false}});profiles=profiles.filter(x=>x.id!==q.id);profiles.push(q);saveAll();login(q);profile();say('Cuenta restaurada.')}catch(e){say('Ese texto no es un respaldo válido de Pulso.','var(--red)')}};
}

/* ---------- Agregar caso ---------- */
const PROMPT=`Convierte este material en un caso para Pulso (formato v1, JSON). Incluye estados que evolucionen con el tiempo, interrogatorio, exploración, estudios con resultados por estado, tratamientos con efectos y errores, acciones críticas, diagnóstico con distractores y retroalimentación con referencias. Material:`;
function add(){
  stopMon();S=null;app.dataset.view='add';
  if(!me()){app.innerHTML=`<section class="band"><h1>Agregar un caso</h1><p class="lede">Para agregar casos necesitas una cuenta. Así quedan guardados en tu perfil y puedes elegir si son públicos o privados.</p><div class="row" style="margin-top:16px"><button class="pri" id="a1">Crear cuenta</button><button id="a2">Ya tengo cuenta</button></div></section>`;$('#a1').onclick=()=>auth('new',add);$('#a2').onclick=()=>auth('in',add);return}
  const tpl=JSON.stringify({id:'mi-caso-01',v:1,title:'Título visible',specialty:'Área',level:'Básico',source:'Artículo o libro de donde sale',setting:'Urgencias',
  patient:{name:'Nombre',age:40,sex:'F',weight:70,cc:'Motivo de consulta'},intro:'Cómo llega.',start:'inicial',
  states:{inicial:{label:'Ingreso',rhythm:'sinus',v:{hr:110,sbp:100,dbp:60,rr:24,spo2:94,t:38.5},d:'Lo que se ve.',worse:{after:30,to:'grave'}},grave:{label:'Deterioro',v:{hr:140,sbp:80,dbp:45,rr:30,spo2:88,t:38.9},d:'...',worse:{after:20,to:'muerte'}},mejor:{label:'Mejoría',goal:true,v:{hr:90,sbp:118,dbp:72,rr:18,spo2:97,t:37.6},d:'...'},muerte:{label:'Muerte',end:'muerte',rhythm:'asistolia',v:{hr:0,sbp:0,dbp:0,rr:0,spo2:0,t:37}}},
  history:[{id:'h1',q:'Pregunta',a:'Respuesta'}],exam:[{id:'e1',n:'Sistema',f:'Hallazgo'}],
  tests:[{id:'t1',n:'Estudio',min:20,r:{inicial:'Resultado al ingreso','*':'Resultado en otros estados'}}],
  treatments:[{id:'r1',n:'Tratamiento correcto',min:10,goto:'mejor',when:['inicial','grave'],delay:0,needs:['t1'],note:'Qué pasa'},{id:'r2',n:'Tratamiento dañino',min:5,harm:{msg:'Por qué es un error'}}],
  diagnosis:{options:['Correcto','Distractor 1','Distractor 2'],correct:0},
  scoring:{critical:[{label:'Pedir el estudio en 15 min',a:['t1'],by:15},{label:'Estudio antes del tratamiento',a:['t1'],before:'r1'}],avoid:[{state:'grave',label:'Evitó el deterioro'}]},
  debrief:{summary:'Resumen',points:['Punto clave'],refs:['Referencia']}},null,2);
  app.innerHTML=`<section class="band"><h1>Agregar un caso</h1>
  <p class="mute" style="max-width:70ch">Mándale a Claude un artículo, capítulo o caso clínico con la instrucción de abajo; te devuelve el JSON listo. Pégalo aquí o sube el archivo .json. Los casos se guardan en tu perfil. Los públicos se pueden compartir con un enlace desde «Mi perfil».</p>
  <div class="two"><div>
    <h2>1 · Instrucción para Claude</h2><pre id="pr">${esc(PROMPT)}</pre><button id="cpr">Copiar instrucción</button>
    <h2 style="margin-top:22px">2 · Pegar o subir el caso</h2>
    <textarea id="ta" placeholder="Pega aquí el JSON del caso (o una lista de casos)" aria-label="JSON del caso"></textarea>
    <div class="row" style="margin-top:10px"><button class="pri" id="imp">Agregar a la biblioteca</button><label class="row" style="min-height:44px"><span>o archivo:</span> <input type="file" id="fi" accept=".json,application/json"></label></div>
    <label class="row small" style="min-height:44px"><input type="checkbox" id="pub" checked style="width:20px;height:20px"> Hacerlo público: otros pueden jugarlo con un enlace${gh.token?' y se publica en la biblioteca de GitHub':''}</label>
    <p class="msg" id="im" role="status"></p>
    <details style="margin-top:14px"><summary style="cursor:pointer;min-height:44px;font-weight:600">Conectar mi repositorio de GitHub</summary>
      <p class="small mute">Funciona cuando la app está publicada en GitHub Pages. Crea un token «fine-grained» con permiso <i>Contents: Read and write</i> solo para este repositorio. Se guarda únicamente en este navegador.</p>
      <div class="two" style="gap:10px"><input id="gho" placeholder="Usuario de GitHub" value="${esc(gh.owner||'')}" style="min-height:44px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">
      <input id="ghr" placeholder="Repositorio (p. ej. guardia)" value="${esc(gh.repo||'')}" style="min-height:44px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">
      <input id="ghb" placeholder="Rama (main)" value="${esc(gh.branch||'')}" style="min-height:44px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">
      <input id="ght" type="password" placeholder="Token" value="${esc(gh.token||'')}" style="min-height:44px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)"></div>
      <div class="row" style="margin-top:10px"><button id="ghs">Guardar conexión</button><button class="ghost" id="ghx">Olvidar token</button><button class="ghost" id="ghall">Subir mis casos públicos</button></div>
    </details>
  </div><div>
    <h2>Formato del caso</h2>
    <ul class="small" style="padding-left:18px">
    <li><b>states</b>: cada estado tiene signos (<code>v</code>), ritmo (<code>sinus</code>, <code>st</code>, <code>ectopia</code>, <code>fv</code>, <code>asistolia</code>) y <code>worse</code>: a cuántos minutos empeora y hacia dónde. <code>goal</code> marca el objetivo; <code>end: "muerte"</code> termina el caso.</li>
    <li><b>tests.r</b>: texto fijo o un resultado por estado, con <code>"*"</code> por defecto.</li>
    <li><b>treatments</b>: <code>goto</code> + <code>when</code> cambian el estado; <code>harm</code> marca un error (con <code>when</code> opcional); <code>delay</code> retrasa el deterioro; <code>needs</code> exige acciones previas.</li>
    <li><b>scoring.critical</b>: acciones esperadas, con plazo (<code>by</code>, minutos) u orden (<code>before</code>).</li></ul>
    <pre>${esc(tpl)}</pre><button id="ctp">Copiar plantilla</button></div></div></section>`;
  const im=$('#im');
  const take=txt=>{try{let d=JSON.parse(txt);d=Array.isArray(d)?d:[d];d.forEach(normalize);for(const c of d){if(BUILTIN.some(b=>b.id===c.id))throw new Error('El id "'+c.id+'" ya existe en los casos incluidos.');const pub=$('#pub').checked;if(othersPublic().some(o=>o.id===c.id)||repo.some(o=>o.id===c.id))c.id+='-'+Date.now().toString(36);c._owner=active;c._by=me().name;c._pub=pub;mine=mine.filter(m=>m.id!==c.id);mine.push(c)}saveMine();im.style.color='var(--ok)';im.textContent=`Listo: ${d.length} caso(s) agregado(s) a tu perfil. Compártelos desde «Mi perfil».`;$('#ta').value='';
    if($('#pub').checked&&gh.token){im.textContent+=' Subiendo a GitHub…';ghSave(d).then(()=>{im.textContent=`Listo: ${d.length} caso(s) guardado(s) en GitHub. Aparecen para todos en 1–2 min.`}).catch(e=>{im.style.color='var(--red)';im.textContent='Se guardó en el navegador, pero no en GitHub: '+e.message})}
  }catch(e){im.style.color='var(--red)';im.textContent='No se pudo agregar: '+e.message}};
  const rd=()=>({owner:$('#gho').value.trim(),repo:$('#ghr').value.trim(),branch:$('#ghb').value.trim()||'main',token:$('#ght').value.trim()});
  $('#ghs').onclick=()=>{gh=rd();try{localStorage.setItem(GHK,JSON.stringify(gh))}catch(e){}im.style.color='var(--ok)';im.textContent='Conexión guardada.'};
  $('#ghx').onclick=()=>{gh={};try{localStorage.removeItem(GHK)}catch(e){}$('#ght').value='';im.textContent='Token borrado de este navegador.'};
  $('#ghall').onclick=()=>{if(!mine.length){im.textContent='No tienes casos locales.';return}gh=rd();im.style.color='var(--ink)';im.textContent='Subiendo…';ghSave(mine.filter(c=>c._pub)).then(()=>{im.style.color='var(--ok)';im.textContent=`${mine.filter(c=>c._pub).length} caso(s) público(s) subido(s) a GitHub.`}).catch(e=>{im.style.color='var(--red)';im.textContent=e.message})};
  $('#imp').onclick=()=>take($('#ta').value);
  $('#fi').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(take)};
  const cp=async(t,b)=>{try{await navigator.clipboard.writeText(t);b.textContent='Copiado'}catch(e){b.textContent='Selecciónalo y copia a mano'}};
  $('#cpr').onclick=e=>cp(PROMPT,e.target);$('#ctp').onclick=e=>cp(tpl,e.target);
}

$('#nav-lib').onclick=lib;$('#nav-add').onclick=add;$('#nav-me').onclick=()=>me()?profile():auth('in');
nav();openShared().then(ok=>{if(!ok)lib()});loadRepo();
}
</script>
